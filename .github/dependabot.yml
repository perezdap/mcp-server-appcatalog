# Dependabot version updates for this repository.
# Dependency alerts (vulnerable pinned versions) are separate and enabled at
# Settings -> Code security and analysis; they do not require this file.
version: 2
updates:
  # Python dependencies managed by uv (updates uv.lock via pyproject.toml).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Prefix Dependabot commit messages to match repo conventions.
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    # Group minor/patch updates into single PRs. Group names flow into
    # branch names and PR titles, so keep them hyphenated.
    groups:
      python-production:
        update-types:
          - "minor"
          - "patch"
      python-dev:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Don't open PRs for new majors (e.g. mcp 2.x); review those manually.
    ignore:
      - dependency-name: "mcp"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"

  # Base image of Dockerfile (currently python:3.12-slim).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
